services:
  postgres:
    image: postgres:12.2-alpine
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=localdb
    volumes:
      - data:/var/lib/postgresql/data
    expose:
      - "5432"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - nakama

  nakama:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --database.address postgres:localdb@postgres:5432/nakama --logger.level DEBUG --config /nakama/data/local.yml
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NAKAMA_CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - NAKAMA_RUNTIME_ENV_DISCORD_CLIENT_ID=1484155345159979038
      - NAKAMA_RUNTIME_ENV_DISCORD_CLIENT_SECRET=yOCOwXSlhfAkZgkccPPeYPHr0bRlbIZY
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nakama

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025" # smtp port
      - "8025:8025" # web ui port
    networks:
      - nakama

networks:
  nakama:

volumes:
  data: