name: nakama-node-1
data_dir: "./data/"

session:
  token_expiry_sec: 3600
  refresh_token_expiry_sec: 604800

logger:
  level: "debug"
  stdout: true
  format: "json"

console:
  port: 7351
  username: "admin"
  password: "password"

socket:
  server_key: "defaultkey"
  port: 7350
  address: "0.0.0.0"
  cors_allowed_origins:
    - "*"

runtime:
  path: "/nakama/data/modules"

cors:
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "*"
  exposed_headers:
    - "*"

social:
  email:
    verification_required: true

mail:
  host: "mailhog"
  port: 1025
  from_address: "noreply@typing99.com"
  from_name: "Typing 99"

