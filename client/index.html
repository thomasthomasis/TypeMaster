<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TYPING 99 // BATTLE ROYALE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@300;700;900&display=swap" rel="stylesheet">

    <style>
      /* Critical CSS to prevent white flash on load */
      :root {
        --bg-obsidian: #0a0a0b;
        --voltage-green: #00ff66;
      }

      body {
        margin: 0;
        background-color: var(--bg-obsidian);
        color: #fff;
        font-family: 'Space Grotesk', sans-serif;
        overflow: hidden; /* Prevent scrollbars during boot sequence */
      }

      /* Gamey Overlay: Scanlines */
      #scanlines {
        position: fixed;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(18, 16, 16, 0) 50%,
          rgba(0, 0, 0, 0.1) 50%
        );
        background-size: 100% 4px;
        z-index: 10000;
        pointer-events: none; /* Let clicks pass through */
        opacity: 0.15;
      }

      /* Gamey Overlay: CRT Vignette */
      #vignette {
        position: fixed;
        inset: 0;
        background: radial-gradient(
          circle at center,
          transparent 50%,
          rgba(0, 0, 0, 0.4) 100%
        );
        z-index: 10001;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="scanlines"></div>
    <div id="vignette"></div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
